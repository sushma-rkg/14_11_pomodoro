<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mockup: Quiet Window</title><style>
*{box-sizing:border-box}
body{margin:0;background:#f4f2ee;color:#2b2f33;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:56px}
header{padding:36px 16px 4px;text-align:center}
h1{font-size:1.7rem;font-weight:600;margin:0}
.sub{margin:8px auto 0;max-width:640px;color:#62676c;line-height:1.5}
h2{text-align:center;font-size:.95rem;letter-spacing:.1em;text-transform:uppercase;color:#62676c;margin:44px 16px 18px}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:28px;padding:0 16px}
figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px}
figure.laptop-fig{width:min(100%,560px)}
figure.phone-fig{width:min(100%,230px)}
figcaption{font-size:.92rem;color:#4a4f55}
.device{container-type:size;position:relative;overflow:hidden;background:#222;border:6px solid #1f2328;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.device.laptop{width:100%;aspect-ratio:16/10;border-radius:12px}
.device.phone{width:100%;aspect-ratio:9/19;border-radius:30px}
.device button{font-family:inherit;cursor:default}
.device a{color:inherit}
.time{font-weight:200;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.btns{display:flex;flex-wrap:wrap}
.btn{border:0;border-radius:999px;font-weight:500;white-space:nowrap}
.art{position:absolute;inset:-8%;filter:blur(calc(var(--b)*1cqw))}
.device{--b:5}
.s-running{--b:2.4}
.s-finished{--b:0}

.art{background:radial-gradient(circle at 70% 28%,#ffe6bd 0 13%,transparent 14%),radial-gradient(ellipse at 15% 112%,#7fa392 0 48%,transparent 49%),radial-gradient(ellipse at 88% 118%,#5f8c96 0 44%,transparent 45%),linear-gradient(180deg,#bcd6e0,#f3e7d4)}
.panel{position:absolute;background:rgba(255,255,255,.55);backdrop-filter:blur(2.4cqw) saturate(1.3);-webkit-backdrop-filter:blur(2.4cqw) saturate(1.3);border:1px solid rgba(255,255,255,.8);color:#25363d;text-align:center}
.center{left:50%;top:50%;transform:translate(-50%,-50%)}
.btns{justify-content:center}
.btn{background:rgba(255,255,255,.8);color:#2f4a52}
.btn.primary{background:#3f6f78;color:#fff}
.title{font-weight:600}
.meta{opacity:.8}
.link{display:inline-block;font-weight:500;text-decoration:underline}
.laptop .panel{border-radius:3cqw;padding:3.5cqw 7cqw}
.laptop .time{font-size:12cqw}
.laptop .btns{gap:1.4cqw;margin-top:2.6cqw}
.laptop .btn{font-size:1.9cqw;padding:1cqw 3cqw}
.laptop .bottom{left:4cqw;right:4cqw;bottom:4cqw;display:grid;grid-template-columns:auto 1fr;gap:5cqw;align-items:center;text-align:left;padding:2.8cqw 4cqw}
.laptop .bottom .time{font-size:8cqw}
.laptop .bottom .btns{justify-content:flex-start;margin-top:1.8cqw}
.laptop .title{font-size:2.5cqw}
.laptop .meta{font-size:1.9cqw;margin-top:.6cqw}
.laptop .link{font-size:1.8cqw;margin-top:1.4cqw}
.phone .panel{border-radius:7cqw;padding:7cqw 9cqw}
.phone .time{font-size:24cqw}
.phone .btns{gap:3cqw;margin-top:6cqw}
.phone .btn{font-size:5cqw;padding:2.6cqw 7cqw}
.phone .bottom{left:4cqw;right:4cqw;bottom:4cqw;padding:6cqw 5cqw}
.phone .bottom .time{font-size:15cqw}
.phone .bottom .btns{margin-top:3.5cqw}
.phone .bottom .info{margin-top:5cqw}
.phone .title{font-size:5.4cqw}
.phone .meta{font-size:4.4cqw;margin-top:1cqw}
.phone .link{font-size:4cqw;margin-top:2.4cqw}
</style></head><body>
<header><h1>Quiet Window</h1><p class="sub">Blurred painting fills the screen, with a frosted-glass panel for the timer. Design mockup only: nothing works yet, and the painting is a coloured shape for now.</p></header>
<h2>On a laptop</h2><div class="row">
<figure class="laptop-fig"><div class="device laptop s-before"><div class="art"></div><div class="panel center"><div class="time">25:00</div><div class="btns"><button type="button" class="btn primary">Start</button><button type="button" class="btn">Reset</button></div></div></div><figcaption>1 · Before starting</figcaption></figure>
<figure class="laptop-fig"><div class="device laptop s-running"><div class="art"></div><div class="panel center"><div class="time">14:32</div><div class="btns"><button type="button" class="btn primary">Pause</button><button type="button" class="btn">Reset</button></div></div></div><figcaption>2 · Timer running</figcaption></figure>
<figure class="laptop-fig"><div class="device laptop s-finished"><div class="art"></div><div class="panel bottom"><div class="head"><div class="time">00:00</div><div class="btns"><button type="button" class="btn primary">Restart session</button></div></div><div class="info"><div class="title">Young Woman with a Water Pitcher</div><div class="meta">Johannes Vermeer · ca. 1662</div><a class="link" href="#">Read about this painting →</a></div></div></div><figcaption>3 · Timer finished</figcaption></figure>
</div>
<h2>On a phone</h2><div class="row">
<figure class="phone-fig"><div class="device phone s-before"><div class="art"></div><div class="panel center"><div class="time">25:00</div><div class="btns"><button type="button" class="btn primary">Start</button><button type="button" class="btn">Reset</button></div></div></div><figcaption>1 · Before starting</figcaption></figure>
<figure class="phone-fig"><div class="device phone s-running"><div class="art"></div><div class="panel center"><div class="time">14:32</div><div class="btns"><button type="button" class="btn primary">Pause</button><button type="button" class="btn">Reset</button></div></div></div><figcaption>2 · Timer running</figcaption></figure>
<figure class="phone-fig"><div class="device phone s-finished"><div class="art"></div><div class="panel bottom"><div class="head"><div class="time">00:00</div><div class="btns"><button type="button" class="btn primary">Restart session</button></div></div><div class="info"><div class="title">Young Woman with a Water Pitcher</div><div class="meta">Johannes Vermeer · ca. 1662</div><a class="link" href="#">Read about this painting →</a></div></div></div><figcaption>3 · Timer finished</figcaption></figure>
</div>
</body></html>
